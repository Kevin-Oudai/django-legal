[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mroudai-django-legal"
version = "0.1.3"
description = "Lightweight Django app to manage legal documents, versioning, acceptance, and update highlights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Kevin Oudai" }
]
keywords = ["django", "legal", "terms", "privacy", "gdpr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "Django>=5.0,<6.0",
]

[project.urls]
Homepage = "https://github.com/Kevin-Oudai/django-legal"
Source = "https://github.com/Kevin-Oudai/django-legal"
Tracker = "https://github.com/Kevin-Oudai/django-legal/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["django_legal*"]
